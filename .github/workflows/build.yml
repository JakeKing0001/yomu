name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Yomu.xcodeproj \
            -scheme Yomu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Yomu.app Payload/
          zip -qry Yomu.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Yomu-ipa
          path: Yomu.ipa

      - name: AltStore / SideStore source
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          SIZE=$(stat -f%z Yomu.ipa)
          VERSION="${TAG#v}"
          DATE=$(date -u +%Y-%m-%d)
          cat > altstore-source.json <<EOF
          {
            "name": "Yomu",
            "identifier": "app.yomu.source",
            "subtitle": "Lettore di manga ispirato a Mihon",
            "iconURL": "https://raw.githubusercontent.com/${REPO}/main/Yomu/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
            "website": "https://github.com/${REPO}",
            "apps": [
              {
                "name": "Yomu",
                "bundleIdentifier": "app.yomu.reader",
                "developerName": "${REPO%%/*}",
                "subtitle": "Lettore di manga ispirato a Mihon",
                "localizedDescription": "Libreria, novità, cronologia, estensioni dai repository Mihon e lettore paginato o webtoon.",
                "iconURL": "https://raw.githubusercontent.com/${REPO}/main/Yomu/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                "tintColor": "8CB5FF",
                "versions": [
                  {
                    "version": "${VERSION}",
                    "date": "${DATE}",
                    "downloadURL": "https://github.com/${REPO}/releases/download/${TAG}/Yomu.ipa",
                    "size": ${SIZE},
                    "minOSVersion": "17.0"
                  }
                ]
              }
            ],
            "news": []
          }
          EOF
          python3 -m json.tool altstore-source.json > /dev/null

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Yomu.ipa
            altstore-source.json
